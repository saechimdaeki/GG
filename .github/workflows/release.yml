name: release

# Push a tag like v0.2.0 to build games and publish their packages to a GitHub Release.
# The release also posts patch notes (feat/fix commits since the last tag, .github/patch-notes.sh) as one issue
# per game, labeled patch-notes + the game's name.
# One matrix entry per game folder; add one when a new game joins the repo.

on:
  push:
    tags: ['v*', 'reel-dungeon-preview-*']

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - game: cursed-pawnshop
            name: CursedPawnshop
          - game: demon-lord-is-busy
            name: DemonLordIsBusy
          - game: sunken-city
            name: SunkenCity
          - game: haunted-movers
            name: HauntedMovers
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - uses: actions/cache@v4
        id: tpl
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2
      - name: Install export templates
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o t.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q t.tpz
          D=~/.local/share/godot/export_templates/4.7.2.stable
          mkdir -p $D
          # ponytail: only the templates the presets use (the full set is 1.3 GB)
          cp templates/version.txt templates/macos.zip templates/windows_release_x86_64.exe $D/
      - name: Export
        run: |
          godot --headless --path . --import
          mkdir -p out
          godot --headless --path . --export-release "macOS" out/${{ matrix.name }}-mac.zip
          godot --headless --path . --export-release "Windows" out/${{ matrix.name }}-windows.exe
          ls -la out
          test -s out/${{ matrix.name }}-mac.zip && test -s out/${{ matrix.name }}-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}
          path: ${{ matrix.game }}/out/*

  build-unity:
    runs-on: [self-hosted, macOS, ARM64, gg-unity-release]
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and package Reel Dungeon
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/reel-dungeon"
          version="$(awk '$1 == "m_EditorVersion:" { print $2 }' "$project/ProjectSettings/ProjectVersion.txt")"
          editor_dir="/Applications/Unity/Hub/Editor/$version"
          unity="$editor_dir/Unity.app/Contents/MacOS/Unity"
          if [[ ! -x "$unity" ]]; then
            echo "::error::Unity $version is missing from the Mac release runner."
            exit 1
          fi
          output="$(mktemp -d "$RUNNER_TEMP/reel-dungeon.XXXXXX")"
          trap 'rm -rf "$output"' EXIT
          mkdir -p out
          build() {
            if ! "$unity" -batchmode -quit -projectPath "$project" -buildTarget "$1" \
              -executeMethod BuildScript.BuildCI -customBuildTarget "$2" -customBuildPath "$3" \
              -logFile "$output/unity.log"; then
              tail -120 "$output/unity.log"
              return 1
            fi
          }
          build OSXUniversal StandaloneOSX "$output/ReelDungeon.app"
          test -x "$output/ReelDungeon.app/Contents/MacOS/Reel Dungeon"
          ditto -c -k --keepParent "$output/ReelDungeon.app" out/ReelDungeon-mac.zip
          unzip -tq out/ReelDungeon-mac.zip
          if [[ -d "$editor_dir/PlaybackEngines/WindowsStandaloneSupport" ]]; then
            mkdir -p "$output/Windows"
            build Win64 StandaloneWindows64 "$output/Windows/ReelDungeon.exe"
            test -s "$output/Windows/ReelDungeon.exe"
            ditto -c -k --keepParent "$output/Windows" out/ReelDungeon-windows.zip
            unzip -tq out/ReelDungeon-windows.zip
          else
            echo "::notice::Windows Build Support (Mono) is not installed; publishing the macOS package only."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reel-dungeon-packages
          path: out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, build-unity]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # patch-notes.sh needs the previous tag
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Patch notes, release, one issue per game
        # Each game gets its own issue labeled with its name; a game with no feat/fix commits gets none.
        run: |
          gh label create patch-notes --color FBCA04 --description "릴리스 패치노트 (자동)" --force
          : > release.md
          # Godot games name themselves in project.godot; Unity games by their README title ("# 릴 던전 (Reel Dungeon)" → 릴 던전)
          for game in $(ls -d */project.godot */ProjectSettings/ProjectVersion.txt 2>/dev/null | cut -d/ -f1 | sort -u); do
            if [ -f "$game/project.godot" ]; then
              name=$(sed -n 's/^config\/name="\(.*\)"/\1/p' "$game/project.godot")
            else
              name=$(head -1 "$game/README.md" | sed 's/^# //; s/ (.*//')
            fi
            .github/patch-notes.sh "$TAG" "$game" > notes.md
            [ -s notes.md ] || continue
            printf '## %s\n\n' "$name" >> release.md && cat notes.md >> release.md
            gh label create "$name" --color 5319E7 --description "$game/" --force
            gh issue create --title "[$name] 패치노트 $TAG" --label patch-notes --label "$name" --body-file notes.md
          done
          cat release.md
          gh release create "$TAG" out/* --title "$TAG" --notes-file release.md
