name: smoke

# One matrix entry per game folder; add one when a new game joins the repo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a script error can leave godot hanging instead of exiting
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: demon-lord-is-busy
            script: res://tests/smoke/story_001_check.gd
          - game: cursed-pawnshop
            script: res://tests/smoke/run_check.gd
          - game: sunken-city
            script: res://tests/smoke/run_check.gd
          - game: haunted-movers
            script: res://tests/smoke/run_check.gd
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import assets
        run: godot --headless --path . --import
      - name: Smoke suite
        # godot exits 0 when a script fails to parse, so also require PASS lines and no SCRIPT ERROR.
        run: |
          set -o pipefail
          godot --headless --path . -s ${{ matrix.script }} 2>&1 | tee smoke.log
          grep -q '^PASS' smoke.log
          ! grep -qE '^FAIL|SCRIPT ERROR' smoke.log
      - name: Network integration (Haunted Movers)
        if: matrix.game == 'haunted-movers'
        run: python3 tests/integration/run_connection_checks.py

  # Reel Dungeon is a Unity project: its EditMode tests run through GameCI.
  # Needs repo secrets UNITY_LICENSE (contents of a Personal .ulf), UNITY_EMAIL, UNITY_PASSWORD
  # — see the root README, "Unity 게임(릴 던전) CI에 필요한 비밀값".
  reel-dungeon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unity secrets present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD 저장소 비밀값이 없습니다. 루트 README '개발 → Unity 게임 CI에 필요한 비밀값'대로 등록하세요."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: reel-dungeon/Library
          key: Library-reel-dungeon-${{ hashFiles('reel-dungeon/Assets/**', 'reel-dungeon/Packages/**', 'reel-dungeon/ProjectSettings/**') }}
          restore-keys: Library-reel-dungeon-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: reel-dungeon
          testMode: editmode
          artifactsPath: reel-dungeon-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-dungeon-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

