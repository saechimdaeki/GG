name: smoke

# One matrix entry per game folder; add one when a new game joins the repo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a script error can leave godot hanging instead of exiting
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: demon-lord-is-busy
            script: res://tests/smoke/story_001_check.gd
          - game: cursed-pawnshop
            script: res://tests/smoke/run_check.gd
          - game: sunken-city
            script: res://tests/smoke/run_check.gd
          - game: haunted-movers
            script: res://tests/smoke/run_check.gd
    defaults:
      run:
        working-directory: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import assets
        run: godot --headless --path . --import
      - name: Smoke suite
        # godot exits 0 when a script fails to parse, so also require PASS lines and no SCRIPT ERROR.
        run: |
          set -o pipefail
          godot --headless --path . -s ${{ matrix.script }} 2>&1 | tee smoke.log
          grep -q '^PASS' smoke.log
          ! grep -qE '^FAIL|SCRIPT ERROR' smoke.log
      - name: Network integration (Haunted Movers)
        if: matrix.game == 'haunted-movers'
        run: python3 tests/integration/run_connection_checks.py

  reel-dungeon:
    if: >-
      github.repository == 'saechimdaeki/GG' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, macOS, ARM64, gg-unity-release]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Unity EditMode tests
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/reel-dungeon"
          version="$(awk '$1 == "m_EditorVersion:" { print $2 }' "$project/ProjectSettings/ProjectVersion.txt")"
          unity="/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/Unity"
          test -x "$unity" || { echo "::error::Unity $version is missing from the Mac runner."; exit 1; }
          output="$(mktemp -d "$RUNNER_TEMP/reel-dungeon-tests.XXXXXX")"
          trap 'rm -rf "$output"' EXIT
          if ! "$unity" -batchmode -projectPath "$project" -runTests -testPlatform EditMode \
            -testResults "$output/results.xml" -logFile "$output/unity.log" || [[ ! -s "$output/results.xml" ]]; then
            tail -120 "$output/unity.log"
            exit 1
          fi
          passed="$(xmllint --xpath 'string(/test-run/@passed)' "$output/results.xml")"
          failed="$(xmllint --xpath 'string(/test-run/@failed)' "$output/results.xml")"
          result="$(xmllint --xpath 'string(/test-run/@result)' "$output/results.xml")"
          skipped="$(xmllint --xpath 'string(/test-run/@skipped)' "$output/results.xml")"
          echo "Unity EditMode: $passed passed, $failed failed, $skipped skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$result" == Passed && "$passed" =~ ^[1-9][0-9]*$ && "$failed" == 0 ]]

  desktop-tenants:
    if: >-
      github.repository == 'saechimdaeki/GG' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, macOS, ARM64, gg-unity-release]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Unity EditMode tests
        shell: bash
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/desktop-tenants"
          version="$(awk '$1 == "m_EditorVersion:" { print $2 }' "$project/ProjectSettings/ProjectVersion.txt")"
          unity="/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/Unity"
          test -x "$unity" || { echo "::error::Unity $version is missing from the Mac runner."; exit 1; }
          output="$(mktemp -d "$RUNNER_TEMP/desktop-tenants-tests.XXXXXX")"
          trap 'rm -rf "$output"' EXIT
          if ! "$unity" -batchmode -projectPath "$project" -runTests -testPlatform EditMode \
            -testResults "$output/results.xml" -logFile "$output/unity.log" || [[ ! -s "$output/results.xml" ]]; then
            tail -120 "$output/unity.log"
            exit 1
          fi
          passed="$(xmllint --xpath 'string(/test-run/@passed)' "$output/results.xml")"
          failed="$(xmllint --xpath 'string(/test-run/@failed)' "$output/results.xml")"
          result="$(xmllint --xpath 'string(/test-run/@result)' "$output/results.xml")"
          skipped="$(xmllint --xpath 'string(/test-run/@skipped)' "$output/results.xml")"
          echo "Unity EditMode: $passed passed, $failed failed, $skipped skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$result" == Passed && "$passed" =~ ^[1-9][0-9]*$ && "$failed" == 0 ]]
